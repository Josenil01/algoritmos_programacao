<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aulas de Algoritmo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            color: #333;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .subtitle {
            font-size: 1em;
            color: #666;
            margin-bottom: 20px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .aula-card {
            position: relative;
            height: 180px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-decoration: none;
            color: white;
            background: #4a5568;
            border: 1px solid #e0e0e0;
        }

        .aula-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
            background: #3a4558;
        }

        .aula-card.locked {
            background: #bdbdbd;
            cursor: not-allowed;
            opacity: 0.5;
            pointer-events: none;
        }

        .aula-card.locked::after {
            content: '🔒';
            position: absolute;
            top: 10px;
            right: 10px;
            font-size: 1.5em;
        }

        .aula-icon {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .aula-number {
            font-size: 1.4em;
            font-weight: 600;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 1.8em;
            }

            .grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
                gap: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎓 Aulas de Algoritmo</h1>
            <p class="subtitle">30 aulas para dominar algoritmos</p>
        </header>

        <div class="grid" id="gridContainer"></div>
    </div>

    <script>
        // Sistema de aulas com verificação de existência
        class AulaSystem {
            constructor() {
                this.totalAulas = 30;
                this.existingAulas = new Set();
                this.checkAulasAndInitialize();
            }

            async checkAulasAndInitialize() {
                // Verifica quais aulas existem
                for (let i = 1; i <= this.totalAulas; i++) {
                    const fileUrl = `aula-${String(i).padStart(2, '0')}.html`;
                    const exists = await this.checkFileExists(fileUrl);
                    if (exists) {
                        this.existingAulas.add(i);
                    }
                }
                this.initializeGrid();
            }

            async checkFileExists(url) {
                try {
                    const response = await fetch(url, { method: 'HEAD' });
                    return response.ok;
                } catch (error) {
                    return false;
                }
            }

            initializeGrid() {
                const grid = document.getElementById('gridContainer');
                grid.innerHTML = '';

                for (let i = 1; i <= this.totalAulas; i++) {
                    const card = this.createAulaCard(i);
                    grid.appendChild(card);
                }
            }

            createAulaCard(numero) {
                const exists = this.existingAulas.has(numero);
                const card = document.createElement('a');
                
                if (exists) {
                    card.href = `aula-${String(numero).padStart(2, '0')}.html`;
                    card.className = 'aula-card';
                } else {
                    card.href = '#';
                    card.className = 'aula-card locked';
                    card.onclick = (e) => {
                        e.preventDefault();
                        alert(`Aula ${numero} ainda não foi criada`);
                    };
                }

                const icons = ['📚', '🔢', '📊', '🎯', '⚡', '🔍', '💡', '🎲', '📈', '🏆',
                               '🚀', '🧩', '🎨', '🔗', '📱', '🌐', '⏱️', '🎪', '🎭', '🎬',
                               '🎤', '🎸', '🎹', '🎺', '🎷', '🥁', '🎻', '🎼', '📻', '📡'];

                const icon = icons[(numero - 1) % icons.length];

                card.innerHTML = `
                    <div class="aula-icon">${icon}</div>
                    <div class="aula-number">Aula ${numero}</div>
                `;

                return card;
            }
        }

        // Inicializar sistema
        const aulaSystem = new AulaSystem();
    </script>
</body>
</html>
